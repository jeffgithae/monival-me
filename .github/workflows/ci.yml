name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      # The existing tree has ~6.3k pre-existing eslint errors (mostly prettier
      # formatting and no-unsafe-* on Mongoose `any`s), so a blocking lint gate
      # would fail every PR on day one and teach everyone to ignore CI. This
      # step reports the count so the debt stays visible without blocking, and
      # `continue-on-error` should be dropped once the backlog is cleared.
      #
      # `--fix` is in the package script; CI must never rewrite files, so the
      # linter runs directly here with the same globs and no fixing.
      - name: Lint (non-blocking — see comment)
        continue-on-error: true
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        run: npm test -- --ci --runInBand
        env:
          # main.ts refuses to boot in production on placeholder secrets; tests
          # run outside production but still construct config, so give them
          # values that satisfy the same length checks.
          NODE_ENV: test
          JWT_SECRET: ci-only-jwt-secret-value-not-used-in-production-0123456789
          ENCRYPTION_KEY: ci-only-encryption-key-not-used-in-production-0123456789

      - name: Build
        run: npm run build

  web:
    name: Web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — publishing needs registry credentials this workflow
      # deliberately does not hold.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
