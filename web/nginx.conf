server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the server version.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets are immutable; index.html must never be cached or a
  # deploy leaves clients pinned to the previous bundle.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Client-side routing: unknown paths are Angular routes, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
