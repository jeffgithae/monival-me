server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the server version.
  server_tokens off;

  # Baseline browser hardening. nginx drops server-level add_header in any
  # location that sets its own, so each location below repeats these.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Only content-hashed build output (main-NVBKF3OQ.js, chunk-…, media/…) is
  # immutable. Matching by extension alone also froze the unhashed files —
  # the service worker script, icons, favicon — for a year, so a deploy that
  # changed them never reached returning browsers. index.html must never be
  # cached or a deploy leaves clients pinned to the previous bundle.
  location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Proxy the API through this origin. The app is built with a relative
  # apiUrl (/api), so the browser never makes a cross-origin request and CORS
  # is not involved at all. `api` is the compose service name, resolved on the
  # compose network.
  location /api/ {
    proxy_pass         http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Long enough for report generation and AI calls, which are not fast.
    proxy_read_timeout 120s;
  }

  # Client-side routing: unknown paths are Angular routes, not 404s.
  # Everything unhashed served from here (ngsw.json, ngsw-worker.js, the
  # manifest, icons) is revalidated on each use.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
